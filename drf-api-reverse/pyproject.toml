[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drf-api-reverse"
version = "1.0.0"
description = "Design-first DRF scaffolding: generate serializers, viewsets, and urls.py from an OpenAPI contract, with idempotent regeneration and contract-drift detection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mahmoud Gamal", email = "mahmoudgshaker2018@gmail.com" }]
maintainers = [{ name = "Mahmoud Gamal", email = "mahmoudgshaker2018@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "django",
    "djangorestframework",
    "drf",
    "rest",
    "api",
    "openapi",
    "codegen",
    "scaffolding",
    "design-first",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "django>=4.2,<5.3",
    "djangorestframework>=3.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
spectacular = ["drf-spectacular>=0.27"]
dev = [
    "drf-api-reverse[test,spectacular,docs]",
    "ruff>=0.6.9",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "django-stubs[compatible-mypy]>=5.1.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15.0",
    "types-PyYAML>=6.0",
    "pre-commit>=3.8.0",
    "build>=1.2.0",
    "twine>=5.1.0",
    "tox>=4.21.0",
    "tox-gh-actions>=3.2.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "hypothesis>=6.112.0",
    "factory-boy>=3.3.0",
    "drf-spectacular>=0.27",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

[project.urls]
Homepage = "https://mahmoudgshake.github.io/MahmoudPackages/drf-api-reverse/"
Documentation = "https://mahmoudgshake.github.io/MahmoudPackages/drf-api-reverse/getting-started/"
Repository = "https://github.com/MahmoudGShake/MahmoudPackages/tree/master/drf-api-reverse"
Issues = "https://github.com/MahmoudGShake/MahmoudPackages/issues"
Changelog = "https://github.com/MahmoudGShake/MahmoudPackages/blob/master/drf-api-reverse/CHANGELOG.md"

[project.scripts]
drf-api-reverse = "drf_api_reverse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drf_api_reverse"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/AUTHORS.md",
    "/action.yml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "T20", "SIM", "RUF", "PL", "PTH",
]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "T20", "S101", "RUF012", "PLC0415"]
"examples/*" = ["RUF012", "PLC0415", "T201"]
"src/drf_api_reverse/cli.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["drf_api_reverse"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"
exclude = ["^tests/test_app/migrations/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "tests.test_app.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.test_app.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --no-migrations"
markers = [
    "integration: marks end-to-end integration tests",
]
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:django.*",
]

[tool.coverage.run]
source = ["drf_api_reverse"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
fail_under = 90
