openapi: 3.0.3
info:
  title: Blog API
  version: "1.0.0"
components:
  schemas:
    Author:
      type: object
      properties:
        id:
          type: integer
        display_name:
          type: string
        email:
          type: string
          format: email
      required:
        - display_name
        - email
    Article:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        author:
          $ref: "#/components/schemas/Author"
        tags:
          type: array
          items:
            type: string
        published_at:
          type: string
          format: date-time
      required:
        - title
        - status
    Comment:
      type: object
      properties:
        id:
          type: integer
        body:
          type: string
        author:
          $ref: "#/components/schemas/Author"
      required:
        - body
paths:
  /authors/:
    get:
      operationId: listAuthors
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Author"
    post:
      operationId: createAuthor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Author"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
  /authors/{id}/:
    get:
      operationId: retrieveAuthor
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
    put:
      operationId: updateAuthor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Author"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
    delete:
      operationId: deleteAuthor
      responses:
        "204": {}
  /articles/:
    get:
      operationId: listArticles
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
    post:
      operationId: createArticle
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Article"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
  /articles/{id}/:
    get:
      operationId: retrieveArticle
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
    patch:
      operationId: partialUpdateArticle
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Article"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
    delete:
      operationId: deleteArticle
      responses:
        "204": {}
  /articles/{id}/comments/:
    get:
      operationId: listArticleComments
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
