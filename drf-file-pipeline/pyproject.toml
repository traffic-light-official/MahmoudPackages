[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drf-file-pipeline"
version = "1.0.0"
description = "Direct-to-S3 upload pipeline for Django REST Framework with resumable uploads, virus scanning, and image processing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mahmoud Gamal", email = "mahmoudgshaker2018@gmail.com" }]
maintainers = [{ name = "Mahmoud Gamal", email = "mahmoudgshaker2018@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "django",
    "djangorestframework",
    "drf",
    "s3",
    "file-upload",
    "resumable-upload",
    "multipart-upload",
    "image-processing",
    "thumbnails",
    "virus-scanning",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "django>=4.2,<5.3",
    "djangorestframework>=3.14",
    "boto3>=1.34",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "drf-file-pipeline[test,docs]",
    "ruff>=0.6.9",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "django-stubs[compatible-mypy]>=5.1.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15.0",
    "boto3-stubs[s3]>=1.34",
    "pre-commit>=3.8.0",
    "build>=1.2.0",
    "twine>=5.1.0",
    "tox>=4.21.0",
    "tox-gh-actions>=3.2.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.112.0",
    "moto[s3]>=5.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

[project.urls]
Homepage = "https://mahmoudgshake.github.io/MahmoudPackages/drf-file-pipeline/"
Documentation = "https://mahmoudgshake.github.io/MahmoudPackages/drf-file-pipeline/getting-started/"
Repository = "https://github.com/MahmoudGShake/MahmoudPackages/tree/master/drf-file-pipeline"
Issues = "https://github.com/MahmoudGShake/MahmoudPackages/issues"
Changelog = "https://github.com/MahmoudGShake/MahmoudPackages/blob/master/drf-file-pipeline/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/drf_file_pipeline"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE", "/AUTHORS.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "T20", "SIM", "RUF", "PL", "PTH"]
ignore = ["PLR0913", "PLR2004", "PLW0603"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "T20", "S101", "RUF012", "PLC0415"]
"examples/*" = ["RUF012", "T20"]
# permission_classes = [...] / Meta.fields = [...] are standard DRF
# class-attribute idioms — never mutated at runtime, so the
# mutable-default-value warning doesn't apply in practice.
"src/drf_file_pipeline/views.py" = ["RUF012"]
"src/drf_file_pipeline/serializers.py" = ["RUF012"]
"src/drf_file_pipeline/models.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["drf_file_pipeline"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"
exclude = ["^tests/test_app/migrations/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "moto.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.test_app.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.test_app.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --no-migrations"
markers = ["benchmark: marks tests as query/perf benchmarks"]
filterwarnings = ["error::DeprecationWarning", "ignore::DeprecationWarning:django.*"]

[tool.coverage.run]
source = ["drf_file_pipeline"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
fail_under = 90
