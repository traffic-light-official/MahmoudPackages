[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drf-jwt-auth-kit"
version = "1.0.0"
description = "Enterprise JWT authentication for Django REST Framework: httpOnly refresh cookies, rotation with reuse detection, device and session management, and MFA hooks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mahmoud Gamal", email = "mahmoudgshaker2018@gmail.com" }]
maintainers = [{ name = "Mahmoud Gamal", email = "mahmoudgshaker2018@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "django",
    "djangorestframework",
    "drf",
    "rest",
    "api",
    "jwt",
    "authentication",
    "auth",
    "mfa",
    "security",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "django>=4.2,<5.3",
    "djangorestframework>=3.14",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
openapi = ["drf-spectacular>=0.27"]
dev = [
    "drf-jwt-auth-kit[test,openapi,docs]",
    "ruff>=0.6.9",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "django-stubs[compatible-mypy]>=5.1.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15.0",
    "pre-commit>=3.8.0",
    "build>=1.2.0",
    "twine>=5.1.0",
    "tox>=4.21.0",
    "tox-gh-actions>=3.2.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "freezegun>=1.5.0",
    "hypothesis>=6.112.0",
    "factory-boy>=3.3.0",
    "drf-spectacular>=0.27",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

[project.urls]
Homepage = "https://mahmoudgshake.github.io/MahmoudPackages/drf-jwt-auth-kit/"
Documentation = "https://mahmoudgshake.github.io/MahmoudPackages/drf-jwt-auth-kit/getting-started/"
Repository = "https://github.com/MahmoudGShake/MahmoudPackages/tree/master/drf-jwt-auth-kit"
Issues = "https://github.com/MahmoudGShake/MahmoudPackages/issues"
Changelog = "https://github.com/MahmoudGShake/MahmoudPackages/blob/master/drf-jwt-auth-kit/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/drf_jwt_auth_kit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/AUTHORS.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "T20", "SIM", "RUF", "PL", "PTH",
]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "T20", "S101", "RUF012", "PLC0415"]
"examples/*" = ["RUF012", "PLC0415"]
"src/drf_jwt_auth_kit/migrations/*" = ["RUF012", "E501"]
"src/drf_jwt_auth_kit/models.py" = ["RUF012"]
"src/drf_jwt_auth_kit/serializers.py" = ["RUF012"]
"src/drf_jwt_auth_kit/views.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["drf_jwt_auth_kit"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"
exclude = ["^tests/test_app/migrations/", "^src/drf_jwt_auth_kit/migrations/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "tests.test_app.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.test_app.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --no-migrations"
markers = [
    "integration: marks end-to-end integration tests",
]
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:django.*",
]

[tool.coverage.run]
source = ["drf_jwt_auth_kit"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
fail_under = 90
