name: Deploy Documentation

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            mkdocs \
            mkdocs-material \
            mkdocstrings[python] \
            mkdocs-gen-files \
            mkdocs-literate-nav \
            mkdocs-section-index \
            mkdocs-autorefs \
            pymdown-extensions \
            griffe

      - name: Build documentation
        shell: bash
        run: |
          set -e

          mkdir -p public

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Mahmoud Packages</title>
            <style>
              body{
                max-width:1000px;
                margin:40px auto;
                font-family:Arial,sans-serif;
                line-height:1.6;
                padding:0 20px;
              }

              h1{
                color:#0969da;
              }

              .package{
                border:1px solid #ddd;
                border-radius:8px;
                padding:16px;
                margin:16px 0;
              }

              a{
                color:#0969da;
                text-decoration:none;
                font-size:20px;
                font-weight:bold;
              }

              small{
                color:#666;
              }
            </style>
          </head>
          <body>

          <h1>Mahmoud DRF Packages</h1>

          <p>
            Production-ready Django REST Framework packages.
          </p>
          EOF

          built=0
          failed=0

          for dir in drf-*; do

            if [ ! -d "$dir" ]; then
              continue
            fi

            if [ ! -f "$dir/mkdocs.yml" ]; then
              echo "Skipping $dir (no mkdocs.yml)"
              continue
            fi

            if [ ! -d "$dir/docs" ]; then
              echo "Skipping $dir (no docs directory)"
              continue
            fi

            echo ""
            echo "======================================="
            echo "Building $dir"
            echo "======================================="

            if (
              cd "$dir"
              mkdocs build --strict
            ); then

              mkdir -p "public/$dir"

              cp -R "$dir/site/." "public/$dir/"

              cat >> public/index.html <<EOF
              <div class="package">
                <a href="$dir/">$dir</a><br>
                <small>Documentation</small>
              </div>
          EOF

              built=$((built+1))

            else

              echo "::warning::Failed to build documentation for $dir"

              failed=$((failed+1))

            fi

          done

          cat >> public/index.html <<'EOF'

          </body>
          </html>
          EOF

          echo ""
          echo "=========================="
          echo "Built : $built"
          echo "Failed: $failed"
          echo "=========================="

          if [ "$built" -eq 0 ]; then
            echo "::error::No documentation was built."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4