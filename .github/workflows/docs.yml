name: Deploy Documentation

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate landing page
        run: |
          mkdir -p public

          cat > public/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Mahmoud Packages</title>
            <style>
              body {
                max-width: 900px;
                margin: 40px auto;
                font-family: Arial, sans-serif;
              }

              h1 {
                color:#0969da;
              }

              ul {
                list-style:none;
                padding:0;
              }

              li {
                margin:12px 0;
              }

              a {
                text-decoration:none;
                font-size:20px;
              }
            </style>
          </head>
          <body>

          <h1>Mahmoud DRF Packages</h1>

          <ul>
          EOF

          for dir in drf-*; do
            if [ -f "$dir/mkdocs.yml" ]; then
              echo "<li><a href=\"$dir/\">$dir</a></li>" >> public/index.html
            fi
          done

          cat >> public/index.html <<EOF
          </ul>

          </body>
          </html>
          EOF
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            mkdocs \
            mkdocs-material \
            mkdocstrings[python] \
            mkdocs-gen-files \
            mkdocs-literate-nav \
            mkdocs-section-index \
            pymdown-extensions
      - name: Build all package docs
        run: |
          mkdir public

          for dir in drf-*; do
            if [ ! -f "$dir/mkdocs.yml" ]; then
                echo "Skipping $dir (no mkdocs.yml)"
                continue
            fi
        
            if [ ! -d "$dir/docs" ]; then
                echo "Skipping $dir (no docs directory)"
                continue
            fi
        
            echo "Building $dir"
        
            (
                cd "$dir"
                mkdocs build
            )
        
            mkdir -p "public/$dir"
            cp -R "$dir/site/." "public/$dir/"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4